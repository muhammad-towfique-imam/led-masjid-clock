[project]
name = "matrix-clock"
version = "0.1.0"
description = "Matrix Clock - Islamic prayer times display"
requires-python = ">=3.10"
dependencies = [
    "tkcalendar",
    "hijri_converter",
    "bangladatetime",
    "beautifulsoup4",
    "lxml",
    "pyinstaller>=6",
]

[project.scripts]
matrix-clock = "mp:main"
