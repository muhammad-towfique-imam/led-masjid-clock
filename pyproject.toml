[project]
name = "matrix-clock"
version = "0.1.0"
description = "Matrix Clock - Islamic prayer times display"
requires-python = ">=3.10"
dependencies = [
    "kivy>=2.3.0",
    "kivymd>=1.2.0",
    "hijri_converter",
    "bangladatetime",
    "beautifulsoup4",
    "lxml",
    "pyinstaller>=6",
]

[project.scripts]
matrix-clock = "mc:main"
